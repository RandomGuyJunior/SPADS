name: PR password security

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  password-security:
    name: Password security
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR content
        uses: actions/checkout@v4
      - name: Block hardcoded deployment credentials
        run: python3 deploy/check-secrets.py
