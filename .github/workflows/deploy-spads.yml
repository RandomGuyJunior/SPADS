name: Deploy SPADS configuration

on:
  push:
    branches: [master]
    paths:
      - 'etc/**'
      - 'deploy/**'
      - 'plugins/officials/RapidMods/**'
      - '.github/workflows/deploy-spads.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose a safe connection test or an actual deployment'
        required: true
        type: choice
        default: connection-test
        options:
          - connection-test
          - deploy

permissions:
  contents: read

concurrency:
  group: spads-production
  cancel-in-progress: false

jobs:
  security-check:
    name: Check deployment credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject hardcoded credentials
        run: python3 deploy/check-secrets.py

  deploy:
    needs: security-check
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    environment: spads-production
    steps:
      - name: Check deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.SPADS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SPADS_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.SPADS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SPADS_DEPLOY_KNOWN_HOSTS }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name; configure the spads-production environment secrets."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.SPADS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SPADS_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/spads_deploy
          chmod 600 ~/.ssh/spads_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Validate key material before attempting any network connection.
          # This detects escaped newlines, truncated keys and wrong secret values.
          if ! ssh-keygen -y -P '' -f ~/.ssh/spads_deploy > /dev/null 2>&1; then
            echo "::error::SPADS_DEPLOY_SSH_KEY is not a valid unencrypted SSH private key. Paste the entire multiline PRIVATE key (including BEGIN/END lines) into the spads-production environment secret; do not paste the .pub key or literal \\n sequences."
            exit 1
          fi
      - name: Verify SSH connection and live directory (read-only)
        env:
          HOST: ${{ secrets.SPADS_DEPLOY_HOST }}
          USER: ${{ secrets.SPADS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/spads_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 "$USER@$HOST" '
            set -eu
            test -d /srv/spads/etc
            test -r /srv/spads/etc
            test -x /srv/spads/etc
            test -w /srv/spads/etc
            command -v python3 >/dev/null
            command -v rsync >/dev/null
            echo "Connection successful; SPADS directory accessible and writable. No files changed."
          '
      - name: Upload approved deployment files
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          HOST: ${{ secrets.SPADS_DEPLOY_HOST }}
          USER: ${{ secrets.SPADS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/spads_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'mkdir -p /tmp/spads-github-deploy/etc /tmp/spads-github-deploy/deploy'
          rsync -az --delete -e "ssh -i $HOME/.ssh/spads_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" etc/ "$USER@$HOST:/tmp/spads-github-deploy/etc/"
          rsync -az -e "ssh -i $HOME/.ssh/spads_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" deploy/deploy-config.py "$USER@$HOST:/tmp/spads-github-deploy/deploy/deploy-config.py"
      - name: Stage RapidMods plugin and downloader without restarting SPADS
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          HOST: ${{ secrets.SPADS_DEPLOY_HOST }}
          USER: ${{ secrets.SPADS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/spads_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'mkdir -p /srv/spads/plugins/officials/RapidMods /srv/spads/deploy'
          rsync -az -e "ssh -i $HOME/.ssh/spads_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" plugins/officials/RapidMods/ "$USER@$HOST:/srv/spads/plugins/officials/RapidMods/"
          rsync -az -e "ssh -i $HOME/.ssh/spads_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" deploy/download-rapid-mod.py deploy/mod-catalog-lookup.py "$USER@$HOST:/srv/spads/deploy/"
      - name: Verify RapidMods capability deployed
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          HOST: ${{ secrets.SPADS_DEPLOY_HOST }}
          USER: ${{ secrets.SPADS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/spads_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" '
            set -eu
            grep -nF "hub-v1" /srv/spads/plugins/officials/RapidMods/RapidMods.pm
          '
      - name: Deploy without restarting SPADS
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          HOST: ${{ secrets.SPADS_DEPLOY_HOST }}
          USER: ${{ secrets.SPADS_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/spads_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            'python3 /tmp/spads-github-deploy/deploy/deploy-config.py /tmp/spads-github-deploy/etc /srv/spads/etc'
